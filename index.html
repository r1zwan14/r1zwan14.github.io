<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Muhammad Rizwan — Neural Playground: Cluster Defender, Pipeline Rush, Neural Ops, Packet Surfer, Architecture Tycoon." />
  <title>Neural Playground · Muhammad Rizwan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Syne:wght@500;700;800&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip" href="#hub">Skip to modes</a>
  <canvas id="ambient" class="ambient" aria-hidden="true"></canvas>
  <div class="scanlines" aria-hidden="true"></div>
  <div class="cursor" id="cursor" aria-hidden="true"></div>
  <div class="cursor-ring" id="cursorRing" aria-hidden="true"></div>

  <header class="topbar">
    <a class="brand" href="/">MR · Neural Playground</a>
    <div class="topbar__actions">
      <button type="button" class="ghost-btn" id="muteBtn" aria-pressed="false">Sound</button>
      <button type="button" class="ghost-btn" id="warpBtn" aria-pressed="true">Warp</button>
      <a class="ghost-btn" href="/bio/">Bio</a>
    </div>
  </header>

  <main>
    <section class="hub" id="hub">
      <div class="hub__intro">
        <p class="eyebrow mono">Select a simulation</p>
        <h1 data-scramble="Choose your playground">Choose your playground</h1>
        <p class="hub__lede">Five fully interactive DevOps arenas. Pick a mode, survive the mesh, ship the pipeline.</p>
      </div>
      <div class="mode-grid" role="list">
        <button type="button" class="mode-card" data-mode="cluster" role="listitem">
          <span class="mode-card__diff mono">Hard</span>
          <h2>Cluster Defender</h2>
          <p>Place pods, HPA, cache &amp; WAF. Hold the control plane against traffic waves and chaos.</p>
          <span class="mode-card__cta mono">Enter →</span>
        </button>
        <button type="button" class="mode-card" data-mode="pipeline" role="listitem">
          <span class="mode-card__diff mono">Med</span>
          <h2>Pipeline Rush</h2>
          <p>Time the gates — Lint, Test, Build, Scan, Deploy. Combos ship faster. Misses roll back.</p>
          <span class="mode-card__cta mono">Enter →</span>
        </button>
        <button type="button" class="mode-card" data-mode="neural" role="listitem">
          <span class="mode-card__diff mono">Sandbox</span>
          <h2>Neural Ops</h2>
          <p>Control-room sandbox. Tune latency, cost, reliability — keep the AI advisor calm.</p>
          <span class="mode-card__cta mono">Enter →</span>
        </button>
        <button type="button" class="mode-card" data-mode="surfer" role="listitem">
          <span class="mode-card__diff mono">Arcade</span>
          <h2>Packet Surfer</h2>
          <p>Lane-surf the VPC. Collect packets, dodge loss spikes, ride CDN boosts.</p>
          <span class="mode-card__cta mono">Enter →</span>
        </button>
        <button type="button" class="mode-card" data-mode="tycoon" role="listitem">
          <span class="mode-card__diff mono">Strategy</span>
          <h2>Architecture Tycoon</h2>
          <p>Drop cloud tiles, wire the graph, hit RPS missions under budget.</p>
          <span class="mode-card__cta mono">Enter →</span>
        </button>
      </div>
      <p class="hub__scores mono" id="hubScores"></p>
    </section>

    <section class="game-view" id="gameView" hidden>
      <div class="game-chrome">
        <button type="button" class="ghost-btn" id="backBtn">← Modes</button>
        <h2 class="game-title mono" id="gameTitle">Game</h2>
        <div class="game-stats mono" id="gameStats"></div>
      </div>
      <div class="game-stage">
        <canvas id="gameCanvas"></canvas>
        <div class="game-hud" id="gameHud"></div>
        <div class="game-overlay" id="gameOverlay" hidden>
          <div class="game-overlay__card">
            <h3 id="overlayTitle">Paused</h3>
            <p id="overlayBody"></p>
            <div class="game-overlay__actions">
              <button type="button" class="solid-btn" id="overlayPrimary">Continue</button>
              <button type="button" class="ghost-btn" id="overlaySecondary">Modes</button>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
